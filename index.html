<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07090f">
<title>ملاحة حائل</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#f3b33d;--gold2:#ffd36b;--bg:#07090f;--card:rgba(13,17,27,.86);--line:rgba(255,255,255,.10);--txt:#eef2f8;--mut:#9aa4b5;--red:#ff3b3b;--grn:#2fd27a;--blue:#3d8bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:'Tajawal',system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
#map{position:fixed;inset:0}
#three{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;display:none;z-index:2}
body.nav #three{display:block}
.maplibregl-ctrl-attrib{font-size:9px!important;opacity:.55}
.hidden{display:none!important}

/* ===== وضع اختيار الوجهة ===== */
#plan{position:fixed;inset:0;pointer-events:none;z-index:5}
body.nav #plan{display:none}
.topbar{pointer-events:auto;position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;gap:8px}
.brand{position:absolute;top:calc(env(safe-area-inset-top) + 66px);right:14px;font-weight:800;font-size:13px;color:var(--gold);letter-spacing:.5px;text-shadow:0 1px 6px #000}
#q{flex:1;height:50px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:500 16px 'Tajawal',sans-serif;padding:0 16px;outline:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#q:focus{border-color:var(--gold)}
#btnMe,#btnSat{width:50px;height:50px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:22px;color:var(--gold)}
#results{pointer-events:auto;position:absolute;top:calc(env(safe-area-inset-top) + 66px);left:12px;right:12px;max-height:52vh;overflow:auto;border-radius:16px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#results:empty{display:none}
.res{padding:12px 16px;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res b{display:block;font-size:15px}
.res small{color:var(--mut);font-size:12px}
#sheet{pointer-events:auto;position:absolute;bottom:0;left:0;right:0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px);background:var(--card);border-top:1px solid var(--line);border-radius:22px 22px 0 0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#dName{font-size:19px;font-weight:800;margin-bottom:4px}
#dInfo{color:var(--mut);font-size:14px;margin-bottom:12px;min-height:20px}
#dInfo b{color:var(--gold)}
.carpick{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px}
.carpick span{color:var(--mut)}
.ct{flex:1;height:40px;border-radius:12px;background:#1b2230;border:1px solid var(--line);font-size:14px;font-weight:700}
.ct.on{border-color:var(--gold);color:var(--gold);background:rgba(243,179,61,.12)}
.cols{display:flex;gap:10px;margin-bottom:12px;justify-content:center}
.cols button{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.25)}
.cols button.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(243,179,61,.35)}
#btnSat.on{border-color:var(--gold)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--txt);margin-bottom:12px}
.chk input{width:20px;height:20px;accent-color:var(--gold)}
.row{display:flex;gap:10px}
.row button{flex:1;height:52px;border-radius:15px;font-size:16px;font-weight:800;background:#1b2230;border:1px solid var(--line)}
.row .gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1203;border:0}
.note{font-size:11px;color:var(--mut);margin-top:10px;text-align:center}
#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 18px);left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-size:14px;white-space:nowrap}

/* ===== واجهة القيادة ===== */
#hud{display:none;position:fixed;inset:0;pointer-events:none;z-index:6}
body.nav #hud{display:block}
#topShade{position:absolute;top:0;left:0;right:0;height:270px;background:linear-gradient(180deg,rgba(5,7,12,.92) 0%,rgba(5,7,12,.65) 55%,rgba(5,7,12,0) 100%)}
#top{position:absolute;top:calc(env(safe-area-inset-top) + 2px);left:0;right:0;display:flex;flex-direction:column;align-items:center}
#gaugeWrap{position:relative;width:min(84vw,370px)}
#gauge{width:100%;display:block}
#spdNum{position:absolute;left:0;right:0;top:45%;text-align:center;font-size:clamp(50px,15vw,74px);font-weight:500;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
#spdUnit{position:absolute;left:0;right:0;top:88%;text-align:center;font-size:12px;color:var(--mut)}
#info{display:flex;align-items:center;justify-content:space-between;width:min(94vw,440px);margin-top:4px;gap:6px;direction:ltr}
#limit{width:46px;height:46px;border-radius:50%;background:#fff;border:5px solid #e2231a;display:flex;align-items:center;justify-content:center;color:#111;font-weight:800;font-size:17px;flex:none}
#limit.unk{opacity:.35}
#limit.over{animation:blink .5s infinite alternate}
@keyframes blink{to{transform:scale(1.15);box-shadow:0 0 18px #ff2a2a}}
.pill{background:rgba(20,26,38,.9);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:13px;white-space:nowrap;direction:rtl}
.pill b{color:var(--gold);font-weight:800}
#road{background:rgba(22,92,58,.95);border-color:rgba(80,220,140,.35);max-width:38vw;overflow:hidden;text-overflow:ellipsis;font-weight:700}
#lane{margin-top:6px}
#lane.busy{border-color:rgba(255,80,80,.6);color:#ffb3b3}
#instr{margin-top:8px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 14px 8px 10px;min-width:min(70vw,300px);max-width:92vw;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#iArrow{width:46px;height:46px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
#iArrow svg{width:30px;height:30px}
.itxt{display:flex;flex-direction:column;min-width:0}
.itxt b{font-size:16px;line-height:1.3}
.itxt small{color:var(--gold);font-size:14px;font-weight:700}
#lanes{display:flex;gap:3px;direction:ltr;margin-inline-start:auto}
#lanes:empty{display:none}
.ln{width:24px;height:30px;border-radius:6px;background:#1d2534;display:flex;align-items:center;justify-content:center}
.ln svg{width:18px;height:18px}
.ln.ok{background:rgba(243,179,61,.22);outline:1px solid var(--gold)}
#alert{margin-top:8px;display:flex;align-items:center;gap:10px;background:rgba(18,20,28,.94);border:1.5px solid var(--gold);border-radius:18px;padding:9px 16px 9px 12px;animation:pop .25s ease-out;max-width:92vw}
#alert.warn{border-color:#ff9f1a;box-shadow:0 0 24px rgba(255,140,0,.35)}
#alert.bad{border-color:var(--red);box-shadow:0 0 28px rgba(255,40,40,.45)}
#aIcon{font-size:26px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;flex:none}
#alert b{display:block;font-size:16px}
#alert small{color:var(--mut);font-size:12px}
@keyframes pop{from{transform:scale(.85);opacity:0}}

.edge{position:fixed;top:0;bottom:0;width:16px;opacity:0;transition:opacity .25s;z-index:4;pointer-events:none}
#edgeL{left:0;background:linear-gradient(90deg,rgba(255,30,30,.95),rgba(255,30,30,0))}
#edgeR{right:0;background:linear-gradient(270deg,rgba(255,30,30,.95),rgba(255,30,30,0))}
.edge.on{opacity:1;animation:edgeP .6s infinite alternate}
@keyframes edgeP{to{opacity:.45}}

#danger{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;background:rgba(150,0,0,.92);border:2px solid #ff6a6a;border-radius:22px;padding:16px 20px;text-align:center;width:min(86vw,360px);display:none;animation:dg .45s infinite alternate}
#danger div{font-size:40px;line-height:1}
#danger b{display:block;font-size:24px;margin:6px 0 2px}
#danger span{font-size:16px}
body.danger #danger{display:block}
body.danger::after{content:'';position:fixed;inset:0;z-index:8;pointer-events:none;box-shadow:inset 0 0 0 7px #ff2020,inset 0 0 70px rgba(255,0,0,.6);animation:dg .45s infinite alternate}
@keyframes dg{to{opacity:.55}}

#bottom{position:absolute;bottom:0;left:0;right:0;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(0deg,rgba(5,7,12,.95),rgba(5,7,12,.75) 70%,rgba(5,7,12,0));pointer-events:auto}
.stats{display:flex;justify-content:space-around;margin-bottom:8px}
.stats div{text-align:center}
.stats b{display:block;font-size:20px;font-weight:800;color:var(--txt)}
.stats small{font-size:11px;color:var(--mut)}
.btns{display:flex;gap:8px}
.btns button{flex:1;height:46px;border-radius:14px;background:#1b2230;border:1px solid var(--line);font-size:14px;font-weight:700}
.btns .red{background:#7d1717;border-color:#b33}
.btns .on{border-color:var(--gold);color:var(--gold)}
#pip{position:absolute;left:10px;bottom:calc(env(safe-area-inset-bottom) + 128px);width:128px;height:96px;border-radius:12px;overflow:hidden;border:1.5px solid var(--gold);background:#000;pointer-events:auto}
#pip video,#pip canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#camStat{position:absolute;bottom:0;left:0;right:0;font-size:10px;background:rgba(0,0,0,.6);text-align:center;padding:2px}
#simTag{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom) + 130px);background:rgba(61,139,255,.2);border:1px solid var(--blue);color:#9cc3ff;font-size:12px;padding:4px 10px;border-radius:10px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 120px);transform:translateX(-50%);z-index:20;background:rgba(10,12,18,.95);border:1px solid var(--gold);padding:10px 16px;border-radius:14px;font-size:14px;max-width:90vw;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
.me-dot{width:20px;height:20px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 8px rgba(61,139,255,.25)}
body.nav .me-dot{display:none}
</style>
</head>
<body>
<div id="map"></div>
<canvas id="three"></canvas>
<div id="edgeL" class="edge"></div>
<div id="edgeR" class="edge"></div>
<div id="danger"><div>⚠️</div><b>انتبه!</b><span>ابعد عن السيارة اللي قدامك عشان ما تصدمها</span></div>

<!-- اختيار الوجهة -->
<div id="plan">
  <div class="topbar">
    <input id="q" type="search" placeholder="وين تبي تروح في حائل؟" autocomplete="off" enterkeyhint="search">
    <button id="btnMe" title="موقعي">◎</button>
    <button id="btnSat" title="قمر صناعي">🛰️</button>
  </div>
  <div id="results"></div>
  <div class="brand">ملاحة حائل 3D</div>
  <div id="hint">اكتب الوجهة أو اضغط على الخريطة</div>
  <div id="sheet" class="hidden">
    <div id="dName"></div>
    <div id="dInfo"></div>
    <div class="carpick">
      <span>سيارتك:</span>
      <button class="ct" data-t="camry">كامري 2021</button>
      <button class="ct" data-t="hilux">هايلكس 2016</button>
    </div>
    <div class="cols" id="cols"></div>
    <label class="chk"><input type="checkbox" id="optCam" checked> تشغيل كاميرا كشف السيارات (الكاميرا الخلفية)</label>
    <div class="row">
      <button id="btnGo" class="gold">ابدأ القيادة</button>
      <button id="btnSim">تجربة بدون قيادة</button>
    </div>
    <div class="note">التطبيق مساعد فقط — خلك منتبه للطريق دايماً</div>
  </div>
</div>

<!-- واجهة القيادة -->
<div id="hud">
  <div id="topShade"></div>
  <div id="top">
    <div id="gaugeWrap">
      <svg id="gauge" viewBox="0 0 320 175"></svg>
      <div id="spdNum">0</div>
      <div id="spdUnit">كم/س</div>
    </div>
    <div id="info">
      <div id="limit" class="unk"><span>--</span></div>
      <div id="road" class="pill">--</div>
      <div id="lead" class="pill">للأمامية <b>--</b></div>
    </div>
    <div id="lane" class="pill">المسار فاضي</div>
    <div id="instr">
      <div id="iArrow"></div>
      <div class="itxt"><b id="iText">جاري التحميل…</b><small id="iDist"></small></div>
      <div id="lanes"></div>
    </div>
    <div id="alert" class="hidden"><div id="aIcon"></div><div><b id="aText"></b><small id="aSub"></small></div></div>
  </div>
  <div id="pip" class="hidden"><video id="vid" playsinline muted autoplay></video><canvas id="boxes"></canvas><span id="camStat"></span></div>
  <div id="simTag" class="hidden">وضع التجربة</div>
  <div id="bottom">
    <div class="stats">
      <div><b id="remD">--</b><small>المسافة</small></div>
      <div><b id="remT">--</b><small>الوقت</small></div>
      <div><b id="eta">--</b><small>الوصول</small></div>
    </div>
    <div class="btns">
      <button id="bEnd" class="red">إنهاء</button>
      <button id="bCam">📷 الكاميرا</button>
      <button id="bMute">🔊 الصوت</button>
      <button id="bCenter" class="hidden">🎯 توسيط</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="app.js"></script>
</body>
</html>
